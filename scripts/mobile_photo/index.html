<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {color-scheme:dark} * {box-sizing:border-box}
body {font:15px system-ui;color:#f5f3ff;background:#08070f;margin:0;padding:8px;}
.actions {display:flex;gap:8px;flex-wrap:wrap}.picker {display:inline-block;padding:10px 16px;margin:6px 0;
 border:1px solid #a78bfa;border-radius:8px;background:#201831;cursor:pointer;font-weight:650}
button {font:inherit;padding:10px 16px;border:1px solid #a78bfa;border-radius:8px;background:#201831;color:inherit;}
button:disabled,.picker.disabled {opacity:.5;cursor:default} input {position:absolute;left:-10000px}
#status,#details {line-height:1.5;overflow-wrap:anywhere;margin:6px 0} progress {width:100%;height:12px}
#preview {display:none;max-width:100%;max-height:180px;border-radius:8px;margin:8px 0;object-fit:contain}
</style>
<label id="pickerLabel" class="picker" for="photo">1. Scegli la foto</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,.heic,.heif">
<img id="preview" alt="Anteprima della foto selezionata">
<div id="details"></div>
<div id="status" role="status" aria-live="polite">Puoi restare nella galleria quanto vuoi.</div>
<progress id="progress" value="0" max="100"></progress>
<div class="actions">
  <button id="send" disabled>2. Carica la foto</button>
  <button id="clear" disabled>Annulla</button>
</div>
<script src="upload.js"></script>
</html>
