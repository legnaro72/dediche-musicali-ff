[server]
enableStaticServing = true
# Su mobile la galleria sospende spesso il browser/WebView. Mantieni la
# sessione (e quindi la bozza) per 15 minuti mentre si sceglie una foto.
disconnectedSessionTTL = 900

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#a78bfa"
backgroundColor = "#08070f"
secondaryBackgroundColor = "#0f0d1a"
textColor = "#f5f3ff"
